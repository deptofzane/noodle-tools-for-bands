name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running for the same ref. The e2e
# job builds the app, so a queue of stale runs is expensive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Dockerfile's base image rather than the newest LTS: CI should
  # run on the Node that actually ships.
  NODE_VERSION: '22'

jobs:
  # Fast feedback, no services. Fails most PRs before the expensive jobs start.
  checks:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  # The node:test suites in scripts/tests, against a real Postgres.
  db-tests:
    name: DB tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noodle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noodle_test
      # Six of the suites write real bytes through `addAudioVersion` /
      # `addSheetVersion`, so this job needs object storage exactly as the e2e
      # one does. Without it they fail with "Object storage is not configured".
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: noodle-db-tests
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO as a step rather than a `services:` container.
      #
      # Service containers can't override a command, and the official image
      # needs `server /data`. The Bitnami image that did start unattended was
      # removed from Docker Hub — `bitnami/minio:latest` now 404s, which is
      # what silently broke this job. Its replacement lives under
      # `bitnamilegacy/`, an explicit deprecation holding pen, so this uses the
      # official image that local development already runs and starts it
      # by hand.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO never became healthy"; docker logs minio; exit 1
      # The committed migrations, not `db:push`. This is deliberately the same
      # path production takes, so a migration that doesn't apply cleanly fails
      # here rather than on deploy.
      - name: Apply migrations
        run: node scripts/migrate.mjs
      - name: Create bucket
        run: node scripts/s3-init.mjs
      - run: pnpm test:db

  # Playwright, against a production build with a service worker — see the
  # note in playwright.config.ts about why dev mode can't test this.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noodle_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/noodle_e2e
      # Not a secret: the suite mints its own session cookie with this and
      # verifies it in-process (see e2e/auth.setup.ts). Nothing outside this
      # job trusts it.
      AUTH_SECRET: e2e-only-secret-not-used-anywhere-else
      # The suite drives http://127.0.0.1, which Auth.js won't trust by default.
      AUTH_TRUST_HOST: 'true'
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: noodle-e2e
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: 'true'
      # Inlined into the client bundle at build time. A placeholder keeps the
      # "isn't set" warning out of the UI under test; no Picker call is made.
      NEXT_PUBLIC_GOOGLE_API_KEY: e2e-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO as a step rather than a `services:` container.
      #
      # Service containers can't override a command, and the official image
      # needs `server /data`. The Bitnami image that did start unattended was
      # removed from Docker Hub — `bitnami/minio:latest` now 404s, which is
      # what silently broke this job. Its replacement lives under
      # `bitnamilegacy/`, an explicit deprecation holding pen, so this uses the
      # official image that local development already runs and starts it
      # by hand.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "MinIO never became healthy"; docker logs minio; exit 1
      - name: Apply migrations
        run: node scripts/migrate.mjs
      # The seed writes real audio and sheet bytes to object storage, so the
      # bucket has to exist before global-setup runs. Idempotent.
      - name: Create bucket
        run: node scripts/s3-init.mjs
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # Builds and starts the app itself (see `webServer` in the config).
      - run: pnpm test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
